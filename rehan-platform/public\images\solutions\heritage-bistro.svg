<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
      <linearGradient id="grad_heritage-bistro" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ea580c" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
      </linearGradient>
      <pattern id="dot_grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.1" />
      </pattern>
    </defs>

    <!-- Background Grounding -->
    <rect width="800" height="450" fill="url(#grad_heritage-bistro)" />
    <rect width="800" height="450" fill="url(#dot_grid)" />

    <!-- Browser Window Card Mockup -->
    <g transform="translate(60, 40)">
      <!-- Window Frame -->
      <rect width="680" height="370" rx="16" fill="#ffffff" fill-opacity="0.97" stroke="rgba(255,255,255,0.4)" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.25))" />
      
      <!-- Top Browser Bar -->
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 664 0 C 672.84 0 680 7.16 680 16 L 680 44 L 0 44 Z" fill="#f8fafc" />
      <line x1="0" y1="44" x2="680" y2="44" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Window Dots -->
      <circle cx="24" cy="22" r="5" fill="#f43f5e" />
      <circle cx="40" cy="22" r="5" fill="#fbbf24" />
      <circle cx="56" cy="22" r="5" fill="#10b981" />
      
      <!-- URL Bar Pill -->
      <rect x="80" y="11" width="380" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0" />
      <text x="96" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b" font-weight="500">https://heritage-bistro-ai.netlify.app</text>

      <!-- Badge in Bar -->
      <rect x="540" y="11" width="120" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" />
      <circle cx="552" cy="22" r="3" fill="#10b981" />
      <text x="562" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#047857" font-weight="600">Live Voice Agent</text>

      <!-- Internal Content Canvas -->
      <rect x="30" y="70" width="620" height="270" rx="12" fill="#f8fafc" stroke="#f1f5f9" />

      <!-- Hero Header Inside Window -->
      <rect x="50" y="95" width="40" height="40" rx="10" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-opacity="0.3" />
      <circle cx="70" cy="115" r="8" fill="#ea580c" />

      <text x="105" y="112" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" fill="#0f172a" font-weight="700">Heritage Bistro</text>
      <text x="105" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569" font-weight="400">Voice AI Concierge & Table Reservation Host</text>

      <!-- Metrics Bar Inside Mockup -->
      <g transform="translate(50, 160)">
        <rect width="580" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" />
        <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="600">Performance Telemetry:</text>
        <text x="175" y="34" font-family="Courier, monospace" font-size="12" fill="#ea580c" font-weight="700">< 650ms Latency • 1st Ring Answer</text>
      </g>

      <!-- Simulated Grid Rows -->
      <g transform="translate(50, 235)">
        <rect x="0" y="0" width="180" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
        <rect x="15" y="18" width="60" height="8" rx="4" fill="#cbd5e1" />
        <rect x="15" y="38" width="130" height="12" rx="4" fill="#0f172a" />
        <rect x="15" y="58" width="90" height="8" rx="4" fill="#94a3b8" />

        <rect x="200" y="0" width="180" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
        <rect x="215" y="18" width="60" height="8" rx="4" fill="#cbd5e1" />
        <rect x="215" y="38" width="130" height="12" rx="4" fill="#ea580c" />
        <rect x="215" y="58" width="90" height="8" rx="4" fill="#94a3b8" />

        <rect x="400" y="0" width="180" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
        <rect x="415" y="18" width="60" height="8" rx="4" fill="#cbd5e1" />
        <rect x="415" y="38" width="130" height="12" rx="4" fill="#10b981" />
        <rect x="415" y="58" width="90" height="8" rx="4" fill="#94a3b8" />
      </g>
    </g>
  </svg>